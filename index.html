<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f2748">
<title>The Entrepreneurial DNA Quiz</title>
<meta name="description" content="A 2–3 minute quiz that reveals what kind of entrepreneurial thinker you are.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Hidden form so Netlify can detect it at deploy time and collect responses. -->
<form name="quiz-results" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input name="archetype">
  <input name="answers">
  <input name="score-strategic-mind">
  <input name="score-innovation-architect">
  <input name="score-impact-catalyst">
  <input name="score-visionary-leader">
</form>

<div class="water" aria-hidden="true"></div>

<main id="app">

  <!-- Intro -->
  <section id="intro" class="screen">
    <p class="label">A two-minute dive</p>
    <h1 class="title">Entrepreneurial DNA</h1>
    <p class="lede">Ten everyday situations. No right answers. Find out what kind of entrepreneurial thinker you are.</p>
    <button id="start" class="btn">Dive in</button>
    <p class="fine">10 questions · anonymous</p>
  </section>

  <!-- Quiz -->
  <section id="quiz" class="screen" hidden>
    <div class="quiz-head">
      <p id="counter" class="label"></p>
      <p class="label dim">−<span id="depth">0</span> m · <span id="zone"></span></p>
    </div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <h2 id="question" tabindex="-1"></h2>
    <div id="options" class="options"></div>
    <button id="back" class="link">← Back</button>
  </section>

  <!-- Result -->
  <section id="result" class="screen" hidden>
    <p class="label">Your archetype</p>
    <h1 id="r-name" class="name" tabindex="-1"></h1>
    <p class="tagline" id="r-tagline"></p>
    <p class="desc" id="r-desc"></p>

    <h3>Your DNA mix</h3>
    <div id="r-mix" class="mix"></div>

    <h3>Natural strengths</h3>
    <ul id="r-strengths"></ul>

    <h3>Where this could take you</h3>
    <ul id="r-careers"></ul>

    <h3>Your Sauder connection</h3>
    <p class="panel" id="r-sauder"></p>

    <div class="actions">
      <button id="share" class="btn">Share result</button>
      <button id="retake" class="link">Retake</button>
    </div>
  </section>

</main>

<script src="quiz-data.js"></script>
<script src="app.js"></script>
</body>
</html>
